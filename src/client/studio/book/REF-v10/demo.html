<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Layered Director Studio Book — Page turns v10</title><link rel="stylesheet" href="book.css"></head><body>
<header class="controls"><label>Width <input id="width" type="range" min="680" max="2400" value="1522"><output id="wo"></output></label><label>Height <input id="height" type="range" min="650" max="1600" value="940"><output id="ho"></output></label><label>Side tab height <input id="markerHeight" type="range" min="64" max="180" value="84"><output id="mho"></output></label><label>Side tab width <input id="markerWidth" type="range" min="48" max="104" value="64"><output id="mwo"></output></label><label><input id="fit" type="checkbox" checked> Fit browser width</label><label><input id="contentToggle" type="checkbox" checked> Sample UI</label><label><input id="artToggle" type="checkbox" checked> Illustrations</label><label><input id="stainToggle" type="checkbox" checked> Stains</label><label><input id="turnToggle" type="checkbox" checked> Page turns</label><label>Turn duration <input id="turnSpeed" type="range" min="350" max="1600" step="50" value="850"></label></header>
<div class="viewport"><main id="book" class="book">
<div class="paper" aria-hidden="true"></div><div class="frame" aria-hidden="true"></div>
<div class="decoration" aria-hidden="true"><div class="sheet left"><img class="stain s1" src="stains/left-top.png"><img class="stain s2" src="stains/left-bottom.png"><img class="stain s3" src="stains/left-inner.png"><img class="art dragon" src="art/dragon.png"><img class="art landscape" src="art/landscape-left.png"></div><div class="sheet right"><img class="stain s1" src="stains/right-top.png"><img class="stain s2" src="stains/right-bottom.png"><img class="art landscape" src="art/landscape-right.png"></div></div>
<nav class="top-tabs" aria-label="Main sections"></nav><button class="library bookmark" aria-label="Library"><img src="tabs/library.png" alt=""></button><nav class="side-tabs" aria-label="Additional sections"></nav><button class="queue bookmark" aria-label="DSH Queue"><img src="tabs/dsh-queue.png" alt=""></button><button class="extra bookmark" aria-label="Additional bookmark"><img src="tabs/bottom-symbol.png" alt=""></button>
<div class="content"><section><h1 id="editor-title">Actor Editor</h1><p>Create or edit a cast member for your story.</p><hr><label>Asset name<input value="test"></label><label>Character name<input placeholder="Name in the story"></label><label>Description<textarea rows="3" placeholder="Background, role, relationships…"></textarea></label><label>Notes for the models<textarea rows="3"></textarea></label></section><section><h1>References</h1><div class="reference"><strong>Approved 1</strong><p>Add or import references here.</p><button>+ Add reference</button></div><details><summary>Brainstorm 2</summary><p>Reference ideas</p></details></section></div>
</main></div><script src="book.js"></script></body></html>
