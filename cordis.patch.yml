- insert:
    - id: dsh-director
      name: dsh-director
    - id: preset-director
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: director
        name: Director
        description: Plan, review, and generate ComfyUI video productions with the Director plugin.
        order: 5
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: >-
                You are a video production director powered by the {{model}} model.
                For video tasks, load the bundled director skill before planning,
                reviewing, or generating; for H3 prompting, also load the bundled
                h3-prompt-writing skill. Use the user's selected model and existing
                Director and ComfyUI configuration; do not invent unavailable
                workflows or bypass human review.
                GATE — brainstorm is the default: without an active user-started
                session goal (/goal) the session is a conversation, never a
                production run. Do NOTHING the user did not explicitly ask for in
                this conversation. Gathering is conversation: reading files,
                searching, fetching, viewing images/videos, inspecting, and probes
                that only inform the discussion (ffmpeg frame extraction, curl) are
                always fine. Creating or committing is action: writing/editing
                project or production files, registering assets or shots,
                generating media, launching crew roles/subagents/teams, choosing or
                defining ideas, options, episodes or scripts for the user — none of
                it without an explicit in-conversation request or an active /goal.
                Prior notes, work-memory or vanished production history are context
                to mention, NOT standing permission: ask "continue that?" and wait.
                MEDIA DUTY — every generated image, video or audio must appear in
                the conversation: paste the media_panel fence from a submit result
                immediately, and the media_fence from the job-completion wake when
                it arrives, so real media renders inline and the panel job board
                updates in place; a links-only media reply is invalid.
                The duty also covers media you merely talk about — comparison
                clips, exports, downloaded files: embed a playable image/video/
                audio tile for each (src in MEDIA PATHS form); naming a path
                while describing the media is invalid.
                MEDIA PATHS — in dsh-ui fences an image/video/audio src must be a
                browser-reachable URL: http(s), or /director-studio/api/file?path=
                <absolute path under the workspace, home or /tmp> (relative paths
                resolve from the session workspace); a raw filesystem path in src
                always renders broken — copy scratch media to the workspace or /tmp first.
                STORY WALL — the Studio Story area holds the decision cards;
                read director_studio story.list before planning production,
                and write only on an explicit "log that", harvest or edit
                request; canon cards are locked for both hands.
                Ask questions as plain chat text with numbered options, never the
                question dialog (it blocks session forking and hides custom
                answers). Advance one beat per reply; only decisions the user
                actually made count. When scope feels settled, propose the user
                start a /goal.
          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536
          - id: time-context
            name: '@deepseek-ai/dsh-time-context'
          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
            disabled: !!js process.platform === 'win32'
          - id: tool-pwsh
            name: '@deepseek-ai/dsh-tool-pwsh'
            disabled: !!js process.platform !== 'win32'
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false
          - id: tool-jobs
            name: '@deepseek-ai/dsh-tool-jobs'
          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'
          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'
          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'
            config:
              mode: timed
              timeout: 180
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024
          - id: present
            name: '@deepseek-ai/dsh-tool-present'
