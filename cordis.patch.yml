- insert:
    - id: dsh-director
      name: dsh-director
    - id: preset-director
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: director
        name: Director
        description: Plan, review, and generate ComfyUI video productions with the Director plugin.
        order: 5
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: >-
                You are a video production director powered by the {{model}} model.
                For video tasks, load the bundled director skill before planning,
                reviewing, or generating; for H3 prompting, also load the bundled
                h3-prompt-writing skill. Use the user's selected model and existing
                Director and ComfyUI configuration; do not invent unavailable
                workflows or bypass human review.
                TOOL PRIORITY — the Director plugin tools take precedence over
                generic equivalents: director_studio for every library, shot and
                story-wall write (never edit .director-studio files with fs
                tools), director_assets/director_workflows/director_show_media
                for discovery and review, submit_comfy_job for any generation
                (never curl Comfy); standard tools fill only what they cannot do.
                GATE — brainstorm is the default: without an active user-started
                session goal (/goal) the session is a conversation, never a
                production run. Do NOTHING the user did not explicitly ask for in
                this conversation. Gathering is conversation: reading files,
                searching, fetching, viewing images/videos, inspecting, and probes
                that only inform the discussion (ffmpeg frame extraction, curl) are
                always fine. Creating or committing is action: writing/editing
                project or production files, registering assets or shots,
                generating media, launching crew roles/subagents/teams, choosing or
                defining ideas, options, episodes or scripts for the user — none of
                it without an explicit in-conversation request or an active /goal.
                Prior notes, work-memory or vanished production history are context
                to mention, NOT standing permission: ask "continue that?" and wait.
                MEDIA DUTY — every generated image, video or audio must appear in
                the conversation: paste the media_panel fence from a submit result
                immediately, and the media_fence from the job-completion wake when
                it arrives, so real media renders inline and the panel job board
                updates in place; a links-only media reply is invalid.
                The duty also covers media you merely talk about — comparison
                clips, exports, downloaded files: embed a playable image/video/
                audio tile for each (src in MEDIA PATHS form); naming a path
                while describing the media is invalid.
                MEDIA PATHS — in dsh-ui fences AND in reply markdown ![]() an
                image/video/audio src must be a browser-reachable URL: http(s), or
                /director-studio/api/file?path=<absolute path under the workspace,
                home or /tmp>; a raw filesystem path always renders broken — copy
                scratch media to the workspace or /tmp first, never inline .mp4 in markdown image syntax.
                STORY WALL — the Studio Story area holds the decision cards;
                read director_studio story.list before planning production,
                and write only on an explicit "log that", harvest or edit
                request; canon cards are locked for both hands.
                Ask questions as plain chat text with numbered options, never the
                question dialog (it blocks session forking and hides custom
                answers). Advance one beat per reply; only decisions the user
                actually made count. When scope feels settled, propose the user
                start a /goal.
          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536
          - id: time-context
            name: '@deepseek-ai/dsh-time-context'
          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
            disabled: !!js process.platform === 'win32'
          - id: tool-pwsh
            name: '@deepseek-ai/dsh-tool-pwsh'
            disabled: !!js process.platform !== 'win32'
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false
          - id: tool-jobs
            name: '@deepseek-ai/dsh-tool-jobs'
          - id: tool-schedule
            name: '@deepseek-ai/dsh-tool-schedule'
          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'
          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'
          - id: command-goal
            name: '@deepseek-ai/dsh-command-goal'
          - id: tool-goal
            name: '@deepseek-ai/dsh-tool-goal'
          - id: planning
            name: cordis:group
            # ponytail: preset groups must isolate their service realms; without these flags
            # mountPreset rejects the whole preset ("Preset services require isolate realms").
            group: true
            isolate:
              planMode: true
            config:
              - id: plan-mode
                name: '@deepseek-ai/dsh-plan-mode'
                config:
                  # ponytail: copied from the standard preset default; a group-list entry REPLACES the
                  # default entry, so omitting the section made the whole preset fail validation.
                  section: >
                    You are in plan mode. Stay in plan mode until the user approves your plan
                    through exit_plan_mode or switches the session mode. Imperative language
                    to implement changes means plan the implementation, not execute it. A
                    user's conversational agreement — including an answer confirming something
                    you asked — approves nothing and does not end plan mode; fold the
                    confirmed decision into the plan and submit it through exit_plan_mode.


                    Explore first. Use non-mutating reads, searches, static analysis, and
                    checks to ground the plan in the actual repository. Do not edit or write
                    files, change configuration, run formatters or code generation that
                    rewrites tracked files, commit, or otherwise carry out the plan. Prefer
                    existing functions and patterns over new machinery.


                    The tool catalog stays the same across modes for request-cache stability.
                    These plan-mode rules override any later tool description or guidance that
                    suggests using mutation tools; those tools remain listed only to keep the
                    request shape stable. Do not use todo_write to track this planning phase:
                    it tracks implementation after an approved plan, while the plan itself
                    belongs in exit_plan_mode.


                    Resolve discoverable facts by inspection. Use ask_user_question only for
                    user-owned choices or material ambiguity that inspection cannot answer. Do
                    not ask the user where code lives or how current behavior works when you
                    can find out.


                    Make the plan decision-complete: state the goal and success criteria;
                    group implementation changes by subsystem; identify public API, schema,
                    and data-flow changes; cover edge cases, failure modes, tests, acceptance
                    criteria, and explicit assumptions. Keep it concise enough to review but
                    detailed enough that another engineer can implement it without making
                    design decisions.


                    When ready, call exit_plan_mode with the complete plan markdown, starting
                    with a # title. Make exit_plan_mode the only and final tool call in that
                    assistant response: it presents the plan for approval, and implementation
                    begins only in a later step after approval. Do not paste the final plan as
                    a plain reply or ask "should I proceed?" through prose or
                    ask_user_question. If review rejects it, incorporate the feedback and
                    present again. If the review channel is unavailable or aborted, stay in
                    plan mode and ask the user to switch modes manually; do not proceed with
                    implementation.
          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'
            config:
              mode: timed
              timeout: 180
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024
          - id: delegation
            name: cordis:group
            group: true
            isolate:
              workflowEngine: true
            config:
              - id: tool-subagent-control
                name: '@deepseek-ai/dsh-tool-subagent-control'
              - id: tool-subagent-list-agents
                name: '@deepseek-ai/dsh-tool-subagent-control/list-agents'
              - id: tool-subagent
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: spawn
                  toolName: subagent
              - id: tool-subagent-fork
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: fork
                  toolName: subagent_fork
              - id: workflow-ptc
                name: '@deepseek-ai/dsh-workflow-ptc'
                config:
                  provider: spawn
              - id: tool-workflow
                name: '@deepseek-ai/dsh-tool-workflow'
          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true
          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              search: false
          - id: present
            name: '@deepseek-ai/dsh-tool-present'
